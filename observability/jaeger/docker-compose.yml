version: "3.8"
services:
    jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
            - "16686:16686"
            - "6831:6831/udp"
            - "6832:6832/udp"
            - "5778:5778"
            - "14268:14268"
            - "14250:14250"
        restart: unless-stopped
