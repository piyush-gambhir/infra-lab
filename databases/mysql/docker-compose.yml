services:
  mysql_db:
    image: mysql:8.4.8
    container_name: MySQLCont
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=mysql
      - MYSQL_PASSWORD=mysql123
    ports:
      - "3306:3306"
    volumes:
      - mysql_db:/var/lib/mysql
  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "8006:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql_db
    depends_on:
      - mysql_db
volumes:
  mysql_db:
    driver: local
