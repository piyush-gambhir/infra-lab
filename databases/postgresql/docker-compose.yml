services:
  postgres_db:
    image: postgres:18.4
    container_name: PostgresCont
    # restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a versioned subdir, so mount the parent
      # (mounting /var/lib/postgresql/data directly fails to start on 18+).
      - postgres_db:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.4
    # restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "8432:80"
    depends_on:
      - postgres_db

volumes:
  postgres_db:
    driver: local
