version: "3"

services:
    zookeeper:
        image: wurstmeister/zookeeper:3.4.6
        environment:
            ZOOKEEPER_SERVER_ID: 1
            ZOOKEEPER_LISTENER_PORT: 2181
        ports:
            - "2181:2181"

    kafka:
        image: wurstmeister/kafka:latest
        environment:
            KAFKA_ADVERTISED_LISTENER: INSIDE:9093
            KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
            KAFKA_LISTENER_NAME_INTERNAL: INSIDE
            KAFKA_LISTENER_PORT: 9093
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_LISTENER_NAME_EXTERNAL: EXTERNAL
            KAFKA_LISTENER_PORT_EXTERNAL: 9092
            KAFKA_ADVERTISED_LISTENER_EXTERNAL: EXTERNAL://localhost:9092
        ports:
            - "9092:9092"
        depends_on:
            - zookeeper
